name: CI (PR Validation)

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.*'
      - 'tsconfig.json'
      - 'eslint.config.*'
      - 'tests/**'
      - 'scripts/**'
      - '.dockerignore'
      - '.env.example'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/deploy.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint & Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check TypeScript including tests
        run: npm run typecheck

      - name: Run Security & Backend Tests
        run: npm test

      # The image build runs npm run build in the Dockerfile as well.
      - name: Build and check the production container
        run: |
          docker compose config --quiet
          docker build --tag ibb-school-hole:pr-check .
